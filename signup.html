<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" href="icon/icon.png">
</head>
<body>
    <form id="signup-form">
    <div class="container">
<h1>Sign Up</h1>
<p>Sign Up to Your Account</p>

<hr>

<label for="username"><b>Username <i class="fa-solid fa-circle-user"></i></b></label>
<input type="text" placeholder="Ivanov Ivan" id="username" required>

<label>
                Number <i class="fa-solid fa-square-phone"></i>
            </label>

            <input type="tel"
                   id="num"
                   name="phone"
                   placeholder="+800 00000 0000"
                   required>

<label for="email"><b>Email <i class="fa-solid fa-envelope"></i> </b></label>
<input type="text" placeholder="registerform@register.yep" id="email" required>

<label for="psw"><b>Password <i class="fa-solid fa-lock"></i> </b></label>
<input type="password" placeholder="Enter password" id="psw" required>


<label for="psw-repeat"><b>Confirm password <i class="fa-solid fa-lock"></i> </b></label>
<input type="password" placeholder="Repeat password"  name="psw-repeat" id="psw-repeat" required>
<hr>

<p>By creating an account you agree to our </p> <a href="#"> Terms & Privacy</a>
<button type="submit" class="registerBtn">Sign Up</button>

    </div>

</form>
<script src="signup.js"></script>

</body>
</html>
